apiVersion: apps/v1
kind: Deployment
metadata:
  name: oomkill-demo
  namespace: oomkill-lab
spec:
  replicas: 2
  selector: { matchLabels: { app: oomkill-demo } }
  template:
    metadata: { labels: { app: oomkill-demo } }
    spec:
      containers:
      - name: leaker
        image: busybox:1.36
        command: ["sh","-c","echo 'Running within limits'; sleep 3600"]
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            memory: "256Mi"    # increased to prevent OOMKill
