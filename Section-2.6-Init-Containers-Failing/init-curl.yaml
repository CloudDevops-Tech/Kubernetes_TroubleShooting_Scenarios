apiVersion: v1
kind: Pod
metadata:
  name: init-curl
  namespace: init-lab
spec:
  initContainers:
  - name: fetch
    image: curlimages/curl:8.8.0
    args: ["-sS","https://example.com","-o","/work/index.html"]
    volumeMounts: [{ name: work, mountPath: /work }]
  containers:
  - name: app
    image: busybox:1.36
    command: ["sh","-c","ls -l /work; sleep 3600"]
    volumeMounts: [{ name: work, mountPath: /work }]
  volumes:
  - name: work
    emptyDir: {}
