apiVersion: v1
kind: Pod
metadata:
  name: init-fail-demo
  namespace: init-lab
spec:
  restartPolicy: Always
  volumes:
  - name: work
    emptyDir: {}
  initContainers:
  - name: migrate
    image: busybox:1.36
    command: ["sh","-c","echo 'running migration'; exit 1"]   # <-- fails on purpose
    volumeMounts:
    - name: work
      mountPath: /work
  containers:
  - name: app
    image: busybox:1.36
    command: ["sh","-c","echo 'app starting'; ls -l /work; sleep 3600"]
    volumeMounts:
    - name: work
      mountPath: /work
