apiVersion: v1
kind: Pod
metadata:
  name: init-good-mount
  namespace: init-lab
spec:
  volumes:
  - name: work-a
    emptyDir: {}
  - name: work-b
    emptyDir: {}
  initContainers:
  - name: seed
    image: busybox:1.36
    command: ["sh","-c","echo seeded > /work/flag; sleep 1"]
    volumeMounts:
    - { name: work-a, mountPath: /work }   # writes to work-a
  containers:
  - name: app
    image: busybox:1.36
    command: ["sh","-c","cat /work/flag || echo 'FLAG MISSING'; sleep 3600"]
    volumeMounts:
    - { name: work-a, mountPath: /work }   # reads from work-b (wrong)
