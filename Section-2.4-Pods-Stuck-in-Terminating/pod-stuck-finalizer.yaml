# Pod with a custom finalizer nothing in the cluster will clear.
# After `kubectl delete`, it stays in STATUS=Terminating until you remove the finalizer(s).
apiVersion: v1
kind: Pod
metadata:
  name: stuck-finalizer-demo
  namespace: term-lab
  finalizers:
    - troubleshooting.local/block-until-manual-cleanup
spec:
  # Fast teardown after you clear metadata.finalizers (optional; default 30s is fine too).
  terminationGracePeriodSeconds: 0
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
