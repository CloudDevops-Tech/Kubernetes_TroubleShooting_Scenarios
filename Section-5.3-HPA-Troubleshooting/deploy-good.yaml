apiVersion: apps/v1
kind: Deployment
metadata:
  name: hpa-demo
  namespace: hpa-lab
spec:
  replicas: 1
  selector: { matchLabels: { app: hpa-demo } }
  template:
    metadata: { labels: { app: hpa-demo } }
    spec:
      containers:
      - name: app
        image: hpa-demo:0.1
        ports: [{ name: http, containerPort: 8080 }]
        resources:
          requests:
            cpu: "150m"            # realistic baseline
            memory: "128Mi"
          limits:
            cpu: "500m"            # headroom to avoid throttling
            memory: "256Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: hpa-demo
  namespace: hpa-lab
spec:
  selector: { app: hpa-demo }
  ports:
  - name: http
    port: 80
    targetPort: 8080            
