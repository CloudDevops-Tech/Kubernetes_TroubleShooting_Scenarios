apiVersion: v1
kind: Pod
metadata:
  name: eph-evict-demo
spec:
  containers:
  - name: writer
    image: busybox:1.36
    command: ["sh","-c","dd if=/dev/zero of=/tmp/blob bs=1M count=200 && sleep 3600"]
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
        ephemeral-storage: "50Mi"   # low limit on purpose
      limits:
        memory: "128Mi"
        ephemeral-storage: "80Mi"   # we'll write ~200Mi -> exceed
    volumeMounts:
    - name: scratch
      mountPath: /tmp
  volumes:
  - name: scratch
    emptyDir: {}                    # uses node's ephemeral storage
