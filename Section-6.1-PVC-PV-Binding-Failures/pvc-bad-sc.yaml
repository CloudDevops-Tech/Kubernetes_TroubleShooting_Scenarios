apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-badsc
  namespace: storage-lab
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests: { storage: 1Gi }
  storageClassName: standard  # intentional failure
---
apiVersion: v1
kind: Pod
metadata:
  name: app-badsc
  namespace: storage-lab
spec:
  containers:
  - name: app
    image: busybox:1.36
    command: ["sh","-c","echo hello > /data/hello && sleep 3600"]
    volumeMounts:
    - name: data
      mountPath: /data
  volumes:
  - name: data
    persistentVolumeClaim: { claimName: data-badsc }
