apiVersion: v1
kind: Pod
metadata:
  name: app-perms-bad
  namespace: storage-lab
spec:
  securityContext:
    runAsUser: 1000
    runAsGroup: 3000
  containers:
  - name: app
    image: busybox:1.36
    command: ["sh","-c","echo 'testing perms...' && touch /data/test && ls -l /data && sleep 3600"]
    volumeMounts:
    - { name: data, mountPath: /data }
  volumes:
  - name: data
    persistentVolumeClaim: { claimName: data-badsc }   # uses the PVC fixed in Scenario 1
