apiVersion: v1
kind: Pod
metadata:
  name: app-perms
  namespace: storage-lab
spec:
  securityContext:
    runAsUser: 1000
    runAsGroup: 3000
    fsGroup: 2000               # the FIX: ensure group ownership on mount
  containers:
  - name: app
    image: busybox:1.36
    command: ["sh","-c","echo 'testing fix...' && touch /data/test_fixed && ls -l /data && sleep 3600"]
    volumeMounts:
    - { name: data, mountPath: /data }
  volumes:
  - name: data
    persistentVolumeClaim: { claimName: data-badsc }
