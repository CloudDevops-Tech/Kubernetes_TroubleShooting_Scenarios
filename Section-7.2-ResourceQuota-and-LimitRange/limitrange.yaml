apiVersion: v1
kind: LimitRange
metadata:
  name: cpu-mem-limits
  namespace: quota-lab
spec:
  limits:
  - type: Container
    default:        # applied if no limits set
      cpu: 500m
      memory: 256Mi
    defaultRequest: # applied if no requests set
      cpu: 100m
      memory: 128Mi
    max:
      cpu: "1"
      memory: 1Gi
    min:
      cpu: 50m
      memory: 64Mi
